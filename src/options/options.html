<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Clear Data for Current Site options</title>
        <link rel="stylesheet" href="options.css">
    </head>
    <body>
        <main>
            <p>Choose what is removed from the current site.</p>

            <form id="options-form">
                <div class="controls">
                    <span class="button-group">
                        <button id="select-all" type="button">Select all</button>
                        <button id="select-none" type="button">Select none</button>
                    </span>
                    <output id="save-status" role="status" aria-live="polite"></output>
                </div>

                <fieldset>
                    <legend class="visually-hidden">Data types</legend>
                    <div id="options-list"></div>
                </fieldset>
            </form>
        </main>

        <script src="../shared/settings.js"></script>
        <script src="options.js"></script>
    </body>
</html>
